services:
  - type: web
    name: ryvl-bot-api
    runtime: node
    plan: free
    rootDir: ryvl-discord-bot/server
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma db push --skip-generate && npm run start:prod
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_OAUTH_REDIRECT_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: PORT
        value: 10000

  - type: web
    name: ryvl-bot-web
    runtime: static
    rootDir: ryvl-discord-bot/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/web/browser
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
