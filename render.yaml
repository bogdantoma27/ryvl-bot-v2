services:
  - type: web
    name: ryvl-bot-api
    runtime: python
    plan: free
    rootDir: ryvl-bot/service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --app-dir . --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: RYVL Bot API
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_APP_URL
        sync: false
      - key: PUBLIC_API_BASE_URL
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_OAUTH_REDIRECT_URI
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: ADMIN_ROLE_IDS
        sync: false
      - key: DEFAULT_ATTENDANCE_CHANNEL_ID
        sync: false
      - key: DEFAULT_LINEUP_CHANNEL_ID
        sync: false
      - key: SCHEDULER_INTERVAL_SECONDS
        value: "30"
      - key: SESSION_SECRET
        generateValue: true

  - type: web
    name: ryvl-bot-web
    runtime: static
    rootDir: ryvl-bot/webapp
    buildCommand: npm ci && printf "window.__RYVL_API_BASE_URL__ = \"%s\";\n" "$NG_APP_API_BASE_URL" > public/runtime-config.js && npm run build
    staticPublishPath: dist/webapp
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NG_APP_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

