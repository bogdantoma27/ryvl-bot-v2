name: Deploy RYVL to Oracle VM
on:
  push:
    branches: [main]
    paths:
      - 'ryvl-discord-bot/**'
      - '.github/workflows/deploy-oracle.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oracle-production
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  deploy:
    name: Deploy backend and frontend
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Deploy the validated revision over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: RELEASE_SHA
          command_timeout: 22m
          script: |
            set -euo pipefail
            [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            exec 9>/home/ubuntu/.ryvl-deploy.lock
            flock -w 1200 9
            cd /home/ubuntu/ryvl-bot-v2
            git fetch origin main
            # Never silently deploy a different, unvalidated revision.
            if [ "$(git rev-parse origin/main)" != "$RELEASE_SHA" ]; then
              echo 'main has advanced. The newer workflow will deploy its validated revision.' >&2
              exit 1
            fi
            git checkout main
            git reset --hard "$RELEASE_SHA"
            bash ryvl-discord-bot/deploy/oracle.sh
      - name: Verify public DNS, TLS, application and OAuth configuration
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: node ryvl-discord-bot/deploy/verify-public-site.mjs
      - name: Verify live Club Tracker and Admin navigation in a real browser
        run: |
          # Guest-only checks; do not sign into Discord or send test data to production.
          npm install --prefix "$RUNNER_TEMP/ryvl-browser" --no-save @playwright/test@1.56.1
          export PLAYWRIGHT_NODE_PATH="$RUNNER_TEMP/ryvl-browser/node_modules"
          node ryvl-discord-bot/web/test/admin-live-smoke.cjs
  cleanup:
    name: Remove this fix's merged validation branch
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove only fix/fc27-club-navigation when fully merged
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REF='heads/fix/fc27-club-navigation'
          # This branch was created solely for this fix. Preserve all other branches.
          if ! BRANCH_SHA="$(gh api "repos/$GH_REPO/git/ref/$REF" --jq '.object.sha' 2>/dev/null)"; then
            echo 'Temporary branch could not be read or is already absent; leaving branches unchanged.'
            exit 0
          fi
          STATUS="$(gh api "repos/$GH_REPO/compare/$BRANCH_SHA...$MAIN_SHA" --jq '.status')"
          if [ "$STATUS" = ahead ] || [ "$STATUS" = identical ]; then
            CURRENT_SHA="$(gh api "repos/$GH_REPO/git/ref/$REF" --jq '.object.sha')"
            if [ "$CURRENT_SHA" != "$BRANCH_SHA" ]; then
              echo 'Preserving branch because its head changed during cleanup.'
              exit 0
            fi
            gh api --method DELETE "repos/$GH_REPO/git/refs/$REF"
            echo 'Removed the fully merged temporary fix branch.'
          else
            echo 'Preserving branch because it contains changes not included in this deployment.'
          fi
