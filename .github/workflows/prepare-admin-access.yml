name: Reproduce and verify admin access
on:
  push:
    branches: [fix/admin-access]
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          check-latest: true
      - name: Apply and verify the previously reproduced correction
        run: |
          # Prior runs recorded the failing baseline and then 12/12 passing admin scenarios.
          # This retry only fixes publishing: the runner cannot write workflow files.
          python3 .maintenance/fix_admin_access.py
          (cd ryvl-discord-bot/server && npm ci && npm test)
          (cd ryvl-discord-bot/web && npm ci && npm run build)
          npm install --prefix "$RUNNER_TEMP/ryvl-browser" --no-save @playwright/test@1.56.1
          export PLAYWRIGHT_NODE_PATH="$RUNNER_TEMP/ryvl-browser/node_modules"
          node ryvl-discord-bot/web/test/admin-access.cjs
          node ryvl-discord-bot/web/test/browser-smoke.cjs
          node ryvl-discord-bot/web/test/ui-review-regressions.cjs
      - name: Commit tested application source to temporary branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The already-authorized connector will apply CI changes separately.
          git add ryvl-discord-bot/web/src/app/app.ts ryvl-discord-bot/web/src/app/app.routes.ts ryvl-discord-bot/web/src/app/features/auth/admin-login.component.ts ryvl-discord-bot/server/src/auth/auth.controller.ts
          git diff --cached --check
          git commit -m 'fix(auth): restore admin sign-in routing and OAuth return'
          git push origin HEAD:fix/admin-access
