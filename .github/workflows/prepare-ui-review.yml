name: Verify public UI review fixes
on:
  push:
    branches: [fix/public-ui-review]
    paths: ['.maintenance/**', '.github/workflows/prepare-ui-review.yml', 'ryvl-discord-bot/web/test/ui-review-regressions.cjs']
permissions:
  contents: write
concurrency:
  group: public-ui-review-preparation
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          check-latest: true
      - name: Build the current public website
        working-directory: ryvl-discord-bot/web
        run: npm ci && npm run build
      - name: Prepare browser checks
        run: npm install --prefix "$RUNNER_TEMP/ryvl-browser" --no-save @playwright/test@1.56.1
      - name: Reproduce the reported UI issues before changes
        id: baseline
        continue-on-error: true
        run: PLAYWRIGHT_NODE_PATH="$RUNNER_TEMP/ryvl-browser/node_modules" node ryvl-discord-bot/web/test/ui-review-regressions.cjs
      - name: Apply reviewed corrections when supplied
        run: |
          test '${{ steps.baseline.outcome }}' = failure
          test -f .maintenance/apply_public_ui_review.py
          python3 .maintenance/apply_public_ui_review.py
          cd ryvl-discord-bot/server
          npm ci
          cd ../web
          node scripts/generate-favicons.cjs
          npm run build
      - name: Verify existing behaviour and all reported regressions
        run: |
          export PLAYWRIGHT_NODE_PATH="$RUNNER_TEMP/ryvl-browser/node_modules"
          node ryvl-discord-bot/web/test/browser-smoke.cjs
          node ryvl-discord-bot/web/test/ui-review-regressions.cjs
      - name: Save only verified source and assets to the isolated branch
        run: |
          git fetch origin fix/public-ui-review
          test "$(git rev-parse origin/fix/public-ui-review)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ryvl-discord-bot/web
          git diff --cached --quiet || git commit -m 'fix(web): apply verified public UI review corrections'
          git push origin HEAD:refs/heads/fix/public-ui-review
