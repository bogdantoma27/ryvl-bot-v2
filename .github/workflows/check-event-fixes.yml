name: Check event date and embed fixes
on:
  push:
    branches: [fix/event-time-and-edits]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ryvl_ci
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: ryvl_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ryvl_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TZ: UTC
      DATABASE_URL: postgresql://ryvl_ci:local-test-only@localhost:5432/ryvl_ci
      RUN_DATABASE_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate backend and event regressions with real disposable PostgreSQL
        working-directory: ryvl-discord-bot/server
        run: |
          npm ci
          npx prisma generate
          npx prisma db push
          npm test
          TZ=America/New_York node --test test/event-time-edit.test.cjs
          TZ=Asia/Tokyo node --test test/event-time-edit.test.cjs
