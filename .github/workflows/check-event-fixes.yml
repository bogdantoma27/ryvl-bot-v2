name: Check event date and embed fixes
on:
  push:
    branches: [fix/event-time-and-edits]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ryvl_ci
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: ryvl_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ryvl_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TZ: UTC
      DATABASE_URL: postgresql://ryvl_ci:local-test-only@localhost:5432/ryvl_ci
      RUN_DATABASE_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build unchanged backend using disposable database
        working-directory: ryvl-discord-bot/server
        run: |
          npm ci
          npx prisma generate
          npx prisma db push
          npm run build
      - name: Reproduce date, timezone and published-edit regressions
        working-directory: ryvl-discord-bot/server
        run: node --test test/event-time-edit.test.cjs test/event-update-database.test.cjs
  clock-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read VM clock and process timezone only
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            timedatectl show --property=Timezone --value
            date --iso-8601=seconds
            node -e 'console.log("Node timezone:",Intl.DateTimeFormat().resolvedOptions().timeZone,"UTC:",new Date().toISOString())'
            pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s).find(x=>x.name==="ryvl-backend");console.log("Backend TZ override:",p?.pm2_env?.TZ||"none")})'
