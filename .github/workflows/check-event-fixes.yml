name: Check event date and embed fixes
on:
  push:
    branches: [fix/event-time-and-edits]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build backend
        working-directory: ryvl-discord-bot/server
        run: npm ci && npm run build
      - name: Verify real embed updates and reproduce remaining web event payload mismatch
        working-directory: ryvl-discord-bot/server
        env:
          TZ: UTC
        run: node --test test/event-time-edit.test.cjs test/event-delivery.test.cjs
