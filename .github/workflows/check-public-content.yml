name: Check public content and Club Tracker
on:
  push:
    branches: [fix/fc27-club-navigation]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          check-latest: true
      - name: Build backend before correcting swallowed upstream failures
        working-directory: ryvl-discord-bot/server
        run: npm ci && npm run build
      - name: Reproduce EA availability failure
        id: availability
        continue-on-error: true
        run: node --test ryvl-discord-bot/server/test/ea-availability.test.cjs
      - name: Apply reviewed corrections after failure reproduction
        run: |
          test '${{ steps.availability.outcome }}' = failure
          python3 .maintenance/fix_public_content.py
          (cd ryvl-discord-bot/server && npm test)
          (cd ryvl-discord-bot/web && npm ci && npm run build)
      - name: Check public pages and preserve Admin access
        run: |
          npm install --prefix "$RUNNER_TEMP/ryvl-browser" --no-save @playwright/test@1.56.1
          export PLAYWRIGHT_NODE_PATH="$RUNNER_TEMP/ryvl-browser/node_modules"
          node ryvl-discord-bot/web/test/public-content-regressions.cjs
          node ryvl-discord-bot/web/test/admin-access.cjs
          node ryvl-discord-bot/web/test/browser-smoke.cjs
          node ryvl-discord-bot/web/test/ui-review-regressions.cjs
      - name: Save validated application changes on this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ryvl-discord-bot README.md ORACLE_VM_DEPLOYMENT.md
          git diff --cached --check
          git commit -m 'fix: refresh FC 27 branding and repair public Club Tracker'
          git push origin HEAD:fix/fc27-club-navigation
