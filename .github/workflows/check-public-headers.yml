name: Check public headers and concise copy
on:
  push:
    branches: [fix/public-headers-copy]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          check-latest: true
      - name: Apply the scoped presentation correction
        run: |
          python3 .maintenance/normalize_public_headers.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path('ryvl-discord-bot/web/src/app/features/public').glob('*.component.ts'):
              text = path.read_text()
              boundary = text.index('export class ')
              cleaned = re.sub(r'[ \t]+$', '', text[:boundary], flags=re.M) + text[boundary:]
              if cleaned != text:
                  path.write_text(cleaned)
          PY
      - name: Build production frontend
        working-directory: ryvl-discord-bot/web
        run: npm ci && npm run build
      - name: Test headers, forms, navigation and existing regressions
        run: |
          npm install --prefix "$RUNNER_TEMP/ryvl-browser" --no-save @playwright/test@1.56.1
          export PLAYWRIGHT_NODE_PATH="$RUNNER_TEMP/ryvl-browser/node_modules"
          node ryvl-discord-bot/web/test/public-header-regressions.cjs
          node ryvl-discord-bot/web/test/admin-access.cjs
          node ryvl-discord-bot/web/test/browser-smoke.cjs
          node ryvl-discord-bot/web/test/ui-review-regressions.cjs
          node ryvl-discord-bot/web/test/public-content-regressions.cjs
      - name: Save verified application files on the temporary branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ryvl-discord-bot/web/src/app/features/public ryvl-discord-bot/web/src/styles.css
          git diff --cached --check
          git commit -m 'fix(ui): unify public page headers and remove verbose filler'
          git push origin HEAD:fix/public-headers-copy
