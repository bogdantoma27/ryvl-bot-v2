name: Check EA match category labels
on:
  push:
    branches: [fix/ea-match-categories]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          check-latest: true
      - name: Reproduce old website match labels before the fix
        run: |
          cd ryvl-discord-bot/web
          npm ci
          npm run build
          npm install --prefix "$RUNNER_TEMP/ryvl-browser" --no-save @playwright/test@1.56.1
          export PLAYWRIGHT_NODE_PATH="$RUNNER_TEMP/ryvl-browser/node_modules"
          set +e
          node test/ea-category-regressions.cjs > /tmp/ea-ui-red.log 2>&1
          RESULT=$?
          set -e
          cat /tmp/ea-ui-red.log
          test "$RESULT" -ne 0
          grep -q 'EA_CATEGORY_UI_ASSERTION:.*expect' /tmp/ea-ui-red.log
      - name: Apply the scoped category fix
        run: python3 .maintenance/fix_ea_categories.py
      - name: Build and test backend
        working-directory: ryvl-discord-bot/server
        run: |
          npm ci
          npx prisma generate
          npm test
      - name: Build frontend and verify category labels and existing regressions
        run: |
          cd ryvl-discord-bot/web
          npm run build
          export PLAYWRIGHT_NODE_PATH="$RUNNER_TEMP/ryvl-browser/node_modules"
          node test/ea-category-regressions.cjs
          node test/browser-smoke.cjs
          node test/ui-review-regressions.cjs
          node test/admin-access.cjs
          node test/public-content-regressions.cjs
          node test/public-header-regressions.cjs
      - name: Save tested code on this temporary branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/fix/ea-match-categories --jq .object.sha)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ryvl-discord-bot/server/src/ea/ea.types.ts ryvl-discord-bot/server/src/ea/ea.service.ts ryvl-discord-bot/server/src/ea/ea-poller.service.ts ryvl-discord-bot/server/src/ea/ea.controller.ts ryvl-discord-bot/server/src/discord/embeds/ea-embed.builder.ts ryvl-discord-bot/web/src/app/features/public/club.component.ts ryvl-discord-bot/web/src/app/features/ea-tracker/ea-tracker.component.ts
          git diff --cached --check
          git commit -m 'fix(ea): preserve source categories and label match embeds accurately'
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/ea-match-categories
  practice-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check practice response capability once without altering tracker configuration
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd /home/ubuntu/ryvl-bot-v2/ryvl-discord-bot/server
            node - <<'NODE'
            require('reflect-metadata');
            require('./dist/config/config.module').ConfigModule.forRoot();
            const { PrismaClient } = require('@prisma/client');
            const { EaService } = require('./dist/ea/ea.service');
            const db = new PrismaClient();
            (async () => {
              const c = await db.clubTrackerConfig.findFirst({ where: { enabled: true }, select: { clubId: true, platform: true } });
              if (!c) return;
              try {
                const matches = await new EaService(db).fetchMatchesRaw(c.clubId, 'practiceMatch', 1, c.platform);
                console.log(JSON.stringify({ requestedCategory: 'practiceMatch', count: matches.length, topLevelTypes: [...new Set(matches.map(m => m.matchType ?? null))], clubTypes: [...new Set(matches.map(m => m.clubs?.[c.clubId]?.matchType ?? null))] }));
              } catch { console.log('No verified practice feed available. Do not enable extra polling or guess numeric practice codes.'); }
            })().catch(() => { console.log('Read-only practice diagnostic unavailable.'); }).finally(() => db.$disconnect());
            NODE
