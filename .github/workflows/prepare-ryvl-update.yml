name: Validate approved RYVL update
on:
  push:
    branches: [update/vpg-automation-public-ux]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ryvl-approved-update-validation
  cancel-in-progress: true
jobs:
  validate:
    if: github.ref == 'refs/heads/update/vpg-automation-public-ux'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ryvl_ci
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: ryvl_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ryvl_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ryvl_ci:local-test-only@localhost:5432/ryvl_ci
      RUN_DATABASE_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          check-latest: true
      - name: Apply reviewed source transformations
        id: apply
        run: |
          python3 .maintenance/apply_approved_update.py
          python3 .maintenance/final_review.py
          echo 'applied=true' >> "$GITHUB_OUTPUT"
      - name: Install backend and generate Prisma client
        working-directory: ryvl-discord-bot/server
        run: |
          npm ci
          npx prisma validate
          npx prisma generate
      - name: Verify additive upgrade preserves an existing guild
        working-directory: ryvl-discord-bot/server
        run: |
          git show e3fcb325b4f37a18676085161ed7611152b36c1a:ryvl-discord-bot/server/prisma/schema.prisma > /tmp/ryvl-before.prisma
          npx prisma db push --schema /tmp/ryvl-before.prisma --skip-generate
          node - <<'NODE'
          const {PrismaClient}=require('@prisma/client');
          const prisma=new PrismaClient();
          prisma.guild.create({data:{id:'999999999999900001',name:'Existing CI guild',defaultFixturesChannelId:'keep-this-channel'}})
            .catch(error=>{console.error(error.message);process.exitCode=1;})
            .finally(()=>prisma.$disconnect());
          NODE
          npx prisma db execute --schema prisma/schema.prisma --file prisma/deploy/vpg-notifications.sql
          npx prisma db execute --schema prisma/schema.prisma --file prisma/deploy/vpg-notifications.sql
      - name: Build and run backend regression tests
        working-directory: ryvl-discord-bot/server
        run: |
          npm run build
          node --test test/*.test.cjs
      - name: Build Angular production frontend
        working-directory: ryvl-discord-bot/web
        run: |
          npm ci
          npm run build
      - name: Browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/ryvl-browser" --no-save @playwright/test@1.56.1
          export PLAYWRIGHT_NODE_PATH="$RUNNER_TEMP/ryvl-browser/node_modules"
          node ryvl-discord-bot/web/test/browser-smoke.cjs
      - name: Validate the reviewed deployment shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          text=Path('.github/workflows/deploy-oracle.yml').read_text()
          script=text.split('          script: |\n',1)[1]
          script='\n'.join(line[12:] if line.startswith('            ') else line for line in script.splitlines())
          subprocess.run(['bash','-n'],input=script,text=True,check=True)
          PY
      - name: Save verified source on the isolated branch only
        run: |
          # The Actions token need not gain permission to edit workflow files.
          # Preserve the reviewed workflow text for the authorized repository owner to apply.
          cp .github/workflows/deploy-oracle.yml .maintenance/deploy-oracle.reviewed.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md ORACLE_VM_DEPLOYMENT.md ryvl-discord-bot .maintenance/deploy-oracle.reviewed.txt
          git diff --cached --quiet || git commit -m 'feat: implement verified VPG automation and public website refinements'
          git push origin HEAD:refs/heads/update/vpg-automation-public-ux
          echo "Verified source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
